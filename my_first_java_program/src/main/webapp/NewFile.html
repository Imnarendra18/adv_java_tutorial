<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colorful Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.card {
    border-radius: 20px;
    background: linear-gradient(to bottom right, #ffffff, #f3f3ff);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

h3 {
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    color: transparent;
    font-weight: bold;
}

.form-control, select {
    border-radius: 30px;
    padding-left: 15px;
    border: 2px solid #ddd;
}

.form-control:focus {
    border-color: #ff4b2b;
    box-shadow: 0 0 10px rgba(255,75,43,0.4);
}

.btn-register {
    background: linear-gradient(to right, #36d1dc, #5b86e5);
    border: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    transition: 0.3s;
}

.btn-register:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(91,134,229,0.8);
}

.progress {
    height: 6px;
    border-radius: 10px;
}

.eye-btn {
    background: none;
    border: none;
    cursor: pointer;
}

.success {
    background: linear-gradient(to right, #11998e, #38ef7d);
    color: white;
    padding: 8px;
    border-radius: 20px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4">

<h3 class="text-center mb-4">✨ Create Account ✨</h3>

<form id="form">

<div class="mb-3">
<input type="text" id="name" class="form-control" placeholder="Full Name">
<small class="text-danger" id="nameErr"></small>
</div>

<div class="mb-3">
<input type="email" id="email" class="form-control" placeholder="Email Address">
<small class="text-danger" id="emailErr"></small>
</div>

<div class="mb-3">
<input type="tel" id="mobile" class="form-control" placeholder="Mobile Number">
<small class="text-danger" id="mobileErr"></small>
</div>

<div class="mb-3">
<div class="input-group">
<input type="password" id="password" class="form-control" placeholder="Password">
<button type="button" class="eye-btn px-3" onclick="toggle()">👁</button>
</div>
<div class="progress mt-1">
<div id="bar" class="progress-bar"></div>
</div>
</div>

<div class="mb-3">
<select id="gender" class="form-control">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="mb-3">
<input type="checkbox" id="terms"> I agree to terms & conditions
<small class="text-danger" id="termsErr"></small>
</div>

<button class="btn btn-register w-100" type="submit">🚀 Register</button>

</form>

<div class="text-center mt-3" id="msg"></div>

</div>
</div>
</div>
</div>

<script>
function toggle(){
    let p = document.getElementById("password");
    p.type = p.type === "password" ? "text" : "password";
}

document.getElementById("password").addEventListener("input", function(){
    let val = this.value;
    let bar = document.getElementById("bar");
    let strength = 0;

    if(val.length >= 6) strength++;
    if(/[A-Z]/.test(val)) strength++;
    if(/[0-9]/.test(val)) strength++;
    if(/[@$!%*?&]/.test(val)) strength++;

    bar.style.width = (strength * 25) + "%";
    bar.className = "progress-bar";

    bar.classList.add(
        strength <= 1 ? "bg-danger" :
        strength == 2 ? "bg-warning" :
        strength == 3 ? "bg-info" : "bg-success"
    );
});

document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();
    let valid = true;

    document.querySelectorAll("small").forEach(e => e.innerText="");

    if(name.value==""){ nameErr.innerText="Name required"; valid=false; }
    if(!email.value.includes("@")){ emailErr.innerText="Invalid email"; valid=false; }
    if(mobile.value.length!=10){ mobileErr.innerText="Enter 10 digits"; valid=false; }
    if(!terms.checked){ termsErr.innerText="Accept terms"; valid=false; }

    if(valid){
        msg.innerHTML = "<div class='success'>🎉 Registration Successful 🎉</div>";
        form.reset();
        bar.style.width="0%";
    }
});
</script>

</body>
</html>
